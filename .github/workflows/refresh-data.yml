name: Refresh WEC data

# Runs the Wikipedia ingester on a schedule (and on manual trigger).
# Race-weekend updates land on Wikipedia within hours of the chequered flag,
# so a daily run during the season keeps standings/results fresh without
# hammering the source.
on:
  schedule:
    # Daily at 06:00 UTC (15:00 KST) — well after race weekends end.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Wikipedia ingester
        working-directory: backend
        env:
          # DATABASE_URL secret should hold Railway's DATABASE_PUBLIC_URL.
          # Add it under Settings → Secrets and variables → Actions.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.ingest.wikipedia
